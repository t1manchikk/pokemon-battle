<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pokemon Battle — Demo</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background:#f5f7fb; color:#222; }
    .arena { display:flex; gap:40px; align-items:flex-start; }
    .player { background:white; padding:16px; border-radius:12px; box-shadow:0 6px 18px rgba(0,0,0,0.08); width:260px; }
    .bar { background:#eee; border-radius:8px; height:18px; overflow:hidden; margin-top:6px; }
    .progress { height:100%; width:100%; transition: width 400ms ease; background:linear-gradient(90deg,#76c7ff,#4aa6ff); }
    #controls { margin-top:18px; display:flex; gap:8px; }
    button { padding:8px 12px; border:0; border-radius:8px; cursor:pointer; background:#3b82f6; color:white; }
    #logs { margin-top:18px; max-height:240px; overflow:auto; background:white; padding:12px; border-radius:8px; box-shadow:0 4px 10px rgba(0,0,0,0.04); }
    #logs p { margin:6px 0; font-size:14px; }
  </style>
</head>
<body>
  <h1>Pokemon Battle — Demo</h1>
  <div class="arena">
    <div class="player" id="player1-card">
      <h3 id="player1-name">Pikachu</h3>
      <div id="player1-hp">120 / 120</div>
      <div class="bar"><div id="player1-progress" class="progress"></div></div>
    </div>

    <div class="player" id="player2-card">
      <h3 id="player2-name">Charmander</h3>
      <div id="player2-hp">100 / 100</div>
      <div class="bar"><div id="player2-progress" class="progress"></div></div>
    </div>
  </div>

  <div id="controls">
    <button id="btn-attack">Атака гравця</button>
    <button id="btn-enemy">Атака противника</button>
    <button id="btn-newgame">Нова битва</button>
  </div>

  <div id="logs" aria-live="polite"></div>

  <script type="module" src="./main.js"></script>
</body>
</html>
